status:
  scope: >-
    The compared declarations prove a finite real two-polarization response
    theorem, exact visible-hidden expectation accounting, cancellation of a
    common leading source response, and quartic algebraic and field-degree
    consequences. The
    general theorem quantifies over the response matrix, finite state,
    diagonal observable, and nonzero common response. The quartic result assumes
    q^4=q+1 and q>1, and the exact response interval follows without a fitted
    parameter. The proof does not establish that physical gravitational waves
    use the proposed visible-hidden observer placement, derive a cosmological
    redshift law, identify q with a measured gravitational coupling, derive
    Newton's constant, or formalize Jacobson's thermodynamic argument. Those
    application claims are outside this submission.
