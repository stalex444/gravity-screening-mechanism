    Stephanie Alexander supplied the research direction, the quartic PDT
    specialization, and publication decisions. Coding agents developed proofs
    and packaging under her direction. Kernel verification is not independent
    human peer review and does not validate the physical observer placement.

fidelity:
  divergences: >-
    The formalization is a finite algebraic abstraction of the standard-siren
    response-ratio idea in the cited gravitational-wave literature. It does not
    reproduce a cosmological propagation equation. Its visible-hidden dilation,
    matrix symmetry hypotheses, and quartic Q specialization are stated in full
    on the Challenge surface and are additional premises specific to this
    development. Both the biased exterior-readout branch and the exact
    common-response cancellation branch are included.

review:
  status: self-assessed
  reviewers: []
  notes: >-
    A prior selected result group in this repository mechanically verified but
    was withdrawn after an automated research-interest and provenance review.
    This replacement changes the principal theorem surface rather than merely
    revising exposition: it quantifies over an arbitrary TT response matrix and
    finite source realization, proves a necessary structural response, includes
    a competing exact cancellation branch, and derives parameter-free quartic
    interval and polynomial consequences. No originality classification is
    claimed. Internal proof and scope audits are not independent peer review or
    Palomar approval.

alignment:
  namespace: StandardSirenRigidity
  statements:
    - source: General response classification and conserved observer placement
      lean: StandardSirenRigidity.structuralTT_globalFlux_standardSirenDistance
      module: Solution
      status: proved
      note: >-
        For arbitrary s, response matrix, finite state, diagonal observable,
        and nonzero common response, the stated symmetries and conservation
        hypotheses force d_inferred=d_true/sqrt(s).
    - source: Quartic parameter-free response interval
      lean: StandardSirenRigidity.quarticStructuralTT_standardSirenRatio_bounds
      module: Solution
      status: proved
      note: >-
        The q^4=q+1 specialization forces the dimensionless distance ratio
        strictly between 1.016 and 1.017 for every admissible response matrix
        and source realization.
    - source: Quartic distance algebraic signature
      lean: StandardSirenRigidity.quarticStandardSirenResponse_algebraicSignature
      module: Solution
      status: proved
      note: >-
        Eliminating q proves the exact degree-eight integer polynomial identity
        for the distance response.
    - source: Quartic amplitude algebraic signature
      lean: StandardSirenRigidity.quarticExteriorAmplitude_algebraicSignature
      module: Solution
      status: proved
      note: >-
        Eliminating q proves the exact monic degree-eight integer polynomial
        identity for the exterior amplitude.
    - source: Quartic distance minimal degree
      lean: StandardSirenRigidity.quarticStandardSirenResponse_minpoly_natDegree
      module: Solution
      status: proved
      note: >-
        The reciprocal distance response has minimal-polynomial degree exactly
        eight, so its displayed equation cannot collapse to lower degree.
    - source: Quartic amplitude minimal degree
      lean: StandardSirenRigidity.quarticExteriorAmplitude_minpoly_natDegree
      module: Solution
      status: proved
      note: >-
        A mod-five Rabin/Frobenius certificate, a monic lift through the
        integers, and Gauss's lemma prove exact degree eight over the rationals.
    - source: Quartic-to-amplitude field tower
      lean: StandardSirenRigidity.quarticExteriorAmplitude_relativeDegree
      module: Solution
      status: proved
      note: >-
        The quartic generator is recovered as a rational function of the
        amplitude, and the resulting amplitude field has relative degree two
        over the embedded quartic field.
    - source: Competing common-response branch
      lean: StandardSirenRigidity.quarticUniversalResponse_cancels_from_standardSiren
      module: Solution
      status: proved
      note: >-
        If the same nonzero inverse-screening response multiplies chirp and
        strain, the inferred standard-siren distance is exactly unchanged.

