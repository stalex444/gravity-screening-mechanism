      note: The divergence separates into exactly the three Ward coefficients.
    - source: Lorentz Ward rigidity
      lean: LorentzSpinTwoScreening.lorentzSpinTwoWardIdentity_forces_relations
      module: Solution
      status: proved
      note: Explicit symmetric polarizations force all three divergence relations.
    - source: Formal self-adjointness rigidity
      lean: LorentzSpinTwoScreening.lorentzSpinTwoSelfAdjoint_forces_traceRelation
      module: Solution
      status: proved
      note: The mutually adjoint trace/divergence coefficients coincide.
    - source: Pauli--Fierz classification
      lean: LorentzSpinTwoScreening.lorentzPauliFierzSymbol_operatorProperties_unique
      module: Solution
      status: proved
      note: Ward identity plus self-adjointness leaves one overall scale.
    - source: Quartic normalization
      lean: LorentzSpinTwoScreening.quartic_lorentzSymbolProperties_force_fullNormalization
      module: Solution
      status: proved
      note: The assumed quartic wave scale fixes all five coefficients.
    - source: Two-channel elimination
      lean: LorentzSpinTwoScreening.lorentzDoubledSpinTwo_sourceReduction
      module: Solution
      status: proved
      note: Source-free partner elimination yields the coefficient 1-l^2 pointwise.
    - source: Combined rigidity and reduction
      lean: LorentzSpinTwoScreening.quarticLorentzSpinTwo_rigidity_and_sourceReduction
      module: Solution
      status: proved
      note: Capstone combining the unique quartic Pauli--Fierz pattern with full source reduction.
    - source: Operator additivity
      lean: LorentzSpinTwoScreening.lorentzPauliFierzSymbol_add
      module: Solution
      status: proved
      note: The five-term symbol is additive in its tensor argument.
    - source: Gauge-kernel invariance
      lean: LorentzSpinTwoScreening.lorentzDoubledSpinTwo_gaugeInvariant
      module: Solution
      status: proved
      note: Kernel shifts of both fields leave both mixed equations unchanged.
    - source: Source conservation
      lean: LorentzSpinTwoScreening.lorentzScreenedSource_conserved
      module: Solution
      status: proved
      note: A Ward-compatible screened output has a conserved source.

