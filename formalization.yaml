    relationship: formalizes
    author_endorsement: participated
    note: >-
      The local note states the exact conditional classification problem,
      the two observer-placement branches, and the quartic specialization
      proved by the compared declarations. This entry records a source-to-code
      relationship and makes no first-presentation or literature-priority
      claim. The physical placement selecting complete flux for chirp and the
      exterior block for strain is explicitly an unvalidated PDT proposal.
  - title: Modified gravitational-wave propagation and standard sirens
    authors:
      - Enis Belgacem
      - Yves Dirian
      - Stefano Foffa
      - Michele Maggiore
    id: DOI:10.1103/PhysRevD.98.023510
    type: article
    location: https://arxiv.org/abs/1805.08731
    relationship: adapts
    author_endorsement: not-contacted
    note: >-
      Source for the gravitational-wave luminosity-distance observable,
      response-ratio framework, conserved-propagation context, and the relation
      between the squared distance ratio and an effective gravitational
      coupling in the stated class of theories. The present development adapts
      that observable to a classified visible-hidden response and a constant
      multiplicative propagation law; it does not claim that the source paper
      contains the quartic assignment.
  - title: The gravitational-wave luminosity distance in modified gravity theories
    authors:
      - Enis Belgacem
      - Yves Dirian
      - Stefano Foffa
      - Michele Maggiore
    id: DOI:10.1103/PhysRevD.97.104066
    type: article
    location: https://arxiv.org/abs/1712.08108
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Establishes gravitational-wave luminosity distance as an observable that
      can differ from electromagnetic luminosity distance under modified
      propagation. The present submission uses that established observable and
      supplies its own conditional quartic response classification.
  - title: GWTC-5.0 Constraints on the Cosmic Expansion Rate and Modified Gravitational-wave Propagation
    authors:
      - LIGO Scientific Collaboration
      - Virgo Collaboration
      - KAGRA Collaboration
    type: article
    location: https://arxiv.org/abs/2605.27227
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Source for the alpha_M luminosity-distance convention, the effective-G
      relation in the stated Horndeski class, and the current c_M posterior.
      The repository's checksum-pinned script locates the fixed quartic local
      slope in the collaboration's released narrow-H0 posterior. Because the
      collaboration fits alpha_M(z)=c_M/E(z)^2 rather than a constant, this is
      reported only as a local-slope compatibility check and not as a direct
      likelihood evaluation of the quartic curve.
  - title: Positive functions on C*-algebras
    authors:
      - W. Forrest Stinespring
    id: DOI:10.2307/2032342
    type: article
    location: https://doi.org/10.2307/2032342
    relationship: background
    author_endorsement: n/a
    note: >-
      Historical source for dilation terminology. The submitted construction
      is an explicit finite norm-preserving two-output map and does not rely on
      the general Stinespring representation theorem as an unproved premise.

