        spend_usd: not tracked
        hardware: local machine
      prompting_notes: >-
        Stephanie Alexander directed the gravity-screening program and asked
        for a strengthened response to a Palomar research-interest review.
        Development shifted the comparison surface from routine Lorentz
        coefficient extraction to a classification theorem for arbitrary TT
        response matrices, its global-conservation consequence, an explicit
