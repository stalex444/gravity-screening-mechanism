version: v0.4

project:
  name: From quartic TT rigidity to a unique cosmological standard-siren response
  description: >-
    Five compared statements connect a finite response classification to a
    unique cosmological transport law. Rotation covariance, self-adjointness,
    a prescribed quadratic weight, and the passive branch force every
    admissible real transverse-traceless response block to equal sqrt(s) times
    the identity. Exact visible-hidden conservation then fixes the finite
    standard-siren response. For q>1 satisfying q^4=q+1, continuity,
    positivity, multiplicative path composition, and that one-step value
    uniquely force the full redshift power law. The capstone proves the matrix
    equality, finite-to-cosmological matching, fixed propagation signs, and
    exact one-step meeting with the inverse local Newton response. The selected
    arithmetic results prove that the observable has degree eight and that its
    field is quadratic over the recovered quartic field.
  authors:
    - Stephanie Alexander
  license: MIT
  responsible_maintainers:
    - Stephanie Alexander

