version: v0.4

project:
  name: Structural rigidity of a conservative two-polarization standard-siren response
  description: >-
    Eight compared statements classify the leading standard-siren response of
    an arbitrary real two-by-two transverse-traceless polarization block.
    Rotation covariance, self-adjointness, a prescribed quadratic weight, and
    the passive branch force the block to be sqrt(s) times the identity. A
    norm-preserving visible-hidden dilation then proves that complete source
    flux and exterior strain determine the distance response 1/sqrt(s), while
    any response common to chirp and strain cancels exactly. For q>1 satisfying
    q^4=q+1, the quartic specialization fixes the response without an adjustable
    parameter, proves 1.016<d_inferred/d_true<1.017, gives exact degree-eight
    polynomial identities, proves that both observable factors have minimal
    degree eight, and identifies the amplitude field as a quadratic extension
    of the quartic field.
  authors:
    - Stephanie Alexander
  license: MIT
  responsible_maintainers:
    - Stephanie Alexander

