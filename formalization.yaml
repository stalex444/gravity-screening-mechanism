status:
  scope: >-
    The compared declarations prove the general two-polarization matrix
    classification and finite conserved-source distance theorem, the unique
    continuous positive multiplicative extension of a quartic one-step value,
    and a capstone joining these results to a redshift power law with fixed
    propagation signs and an exact one-step effective-Newton equality. They
    also prove exact degree-eight and relative-degree results for the finite
    observable. The theorem derives the cosmological curve conditional on path
    composition and F(q)=R_q. It does not establish that physical gravitational
    waves use the proposed visible-hidden observer placement or that a factor-q
    scale change physically realizes one response step. It does not derive
    Newton's constant or formalize Jacobson's thermodynamic argument.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - propext
    - Classical.choice
    - Quot.sound
  main_results:
    - declaration: StandardSirenRigidity.quarticStructuralTT_cosmologicalTransport_capstone
      file: Solution.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json
      literature_dependencies:
        - statement: Standard siren distance compares source evolution with strain amplitude.
          source: Modified gravitational-wave propagation and standard sirens
        - statement: A constant alpha_M gives a GW-to-EM luminosity-distance ratio (1+z)^(alpha_M/2).
          source: GWTC-5.0 Constraints on the Cosmic Expansion Rate and Modified Gravitational-wave Propagation
        - statement: The squared GW-to-EM distance ratio equals an effective gravitational-coupling ratio in the stated modified-gravity class.
          source: GWTC-5.0 Constraints on the Cosmic Expansion Rate and Modified Gravitational-wave Propagation
    - declaration: StandardSirenRigidity.continuousQuarticScaleResponse_unique
      file: Solution.lean
      sorry_count: 0
