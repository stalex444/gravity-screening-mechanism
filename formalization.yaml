status:
  scope: >-
    The ten compared declarations cover an explicit flat-Minkowski Fourier
    symbol, Ward-identity and self-adjointness coefficient rigidity, a
    pointwise two-channel source reduction, additivity, invariance under
    kernel shifts, and source conservation. The quartic statement assumes the
    wave coefficient equals 1-(1-1/q)^2 and proves its rational form and all
    Pauli--Fierz coefficients. It does not prove that physical spacetime
    selects q, construct a nonlinear spacetime, reproduce the Barnich--
    Troessaert prepotential map, formalize Deser's bootstrap, formalize
    Jacobson's thermodynamic argument, or verify an experimental value of G.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - propext
    - Classical.choice
    - Quot.sound

automation:
  methods:
    - method: agent
      models:
        - OpenAI GPT-family; exact model revision not recorded
      framework: Codex
      tool_setup: >-
        Human-directed theorem selection, Lean compiler iteration, source and
        scope review, and Palomar packaging. The proof development was checked
        with Lean 4.31.0 and Mathlib commit
        fabf563a7c95a166b8d7b6efca11c8b4dc9d911f. Challenge imports only
        Mathlib. Axiom printing is included in Solution.
      cost:
        wall_time: Sessions through 2026-09-07; cumulative elapsed effort not tracked
        spend_usd: not tracked
        hardware: local machine
      prompting_notes: >-
        The author directed the gravity-screening program, identified the
        quartic coupling and its Jacobson application, and requested a
        submission for registry feedback. Proof development was repeatedly
        narrowed to a Lorentz-covariant, gauge-compatible theorem surface.
        The final package distinguishes kernel-checked mathematics from the
        physical correspondence and avoids counting G and Jacobson's entropy
        coefficient twice.
  spend_usd: not tracked
  notes: >-
    Stephanie Alexander supplied the research direction and publication
    decisions. Coding agents developed proofs and packaging under her
    direction. Kernel verification is not independent human peer review.

fidelity:
  divergences: >-
    The formalization proves a self-contained linear classification and
    elimination theorem inspired by, rather than claimed to be a line-by-line
    formalization of, the cited physics papers. All application-level premises
    absent from the theorem statements are named in the scope field.

review:
  status: self-assessed
  reviewers: []
  notes: >-
    Internal proof and scope audits do not constitute independent peer review
    or Palomar approval. The package is being prepared specifically so that
    the registry can assess both exact statement alignment and plausible
    research interest.

alignment:
  namespace: LorentzSpinTwoScreening
