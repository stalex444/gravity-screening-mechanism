version: v0.4

project:
  name: Lorentz spin-two rigidity and quartic source reduction
  description: >-
    Ten compared statements classify the standard parity-even, local,
    two-derivative five-term symbol on symmetric rank-two fields in
    four-dimensional Minkowski space and analyze a doubled sourced system.
    The Lorentz Ward identity and formal self-adjointness force the
    Pauli--Fierz coefficient pattern up to one scale. A source-free partner
    channel can then be eliminated componentwise without inverting the gauge
    operator: the full sourced output acquires the uniform coefficient
    1-l^2, both channel equations are invariant under arbitrary gauge-kernel
    shifts, and the Ward identity forces conservation of the source. Under
    the specialization l=1-1/q, the entire normalization is
    (2q-1)/q^2. This supplies a compact exact result for researchers in
    linearized gravity, constrained field theory, and formalized mathematical
    physics. The motivating PDT application takes q to be the positive root
    of q^4=q+1 and identifies the partner coupling with a gravitational
    screening response; it then fills the entropy-area coefficient in
    Jacobson's thermodynamic route to the Einstein equation. That physical
    correspondence is disclosed as an application and is not built into the
    compared theorem hypotheses.
  authors:
    - Stephanie Alexander
  license: MIT
  responsible_maintainers:
    - Stephanie Alexander

