sources:
  - title: Lorentz spin-two rigidity and quartic source reduction
    authors:
      - Stephanie Alexander
    type: original-proof
    relationship: other
    note: >-
      This repository is the source of the combined classification and
      no-inverse source-reduction theorem. The Pauli--Fierz pattern and the
      general literature on spin-two duality are established background; no
      priority claim for those subjects and no exhaustive first-formalization
      claim are made.
  - title: On relativistic wave equations for particles of arbitrary spin in an electromagnetic field
    authors:
      - Markus Fierz
      - Wolfgang Pauli
    id: DOI:10.1098/rspa.1939.0140
    type: article
    location: https://doi.org/10.1098/rspa.1939.0140
    relationship: background
    note: >-
      Classical source for the relativistic spin-two framework. The present
      entry works with an explicit massless five-term Fourier symbol and
      proves its coefficient classification directly.
  - title: Manifest spin 2 duality with electric and magnetic sources
    authors:
      - Glenn Barnich
      - Cedric Troessaert
    id: arXiv:0812.0552v2
    type: article
    location: https://arxiv.org/abs/0812.0552v2
    relationship: background
    note: >-
      Published duality-symmetric formulation of spin-two fields on Minkowski
      space with external electric and magnetic sources. It motivates the
      doubled-channel question. The paper's prepotential construction and
      surface charges are not formalized here.
  - title: Thermodynamics of Spacetime - The Einstein Equation of State
    authors:
      - Ted Jacobson
    id: arXiv:gr-qc/9504004v2
    type: article
    location: https://arxiv.org/abs/gr-qc/9504004v2
    relationship: background
    note: >-
      Derives the Einstein equation from local horizon thermodynamics given
      entropy proportional to area. The PDT application supplies a candidate
      value for the proportionality coefficient through its value of G.
      Jacobson's thermodynamic derivation and the physical identification are
      cited, not formalized, and G and the entropy density are not counted as
      independent numerical results.
  - title: Self-Interaction and Gauge Invariance
    authors:
      - Stanley Deser
    id: arXiv:gr-qc/0411023v3
    type: article
    location: https://arxiv.org/abs/gr-qc/0411023v3
    relationship: background
    note: >-
      Gives the consistency bootstrap from a linear massless spin-two gauge
      field to Einstein nonlinearities. The present entry stops at the exact
      linear symbol and source reduction; the nonlinear bootstrap is not
      formalized.

